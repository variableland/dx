packages:
  - apps/*
  - packages/*
onlyBuiltDependencies:
  - "@biomejs/biome"
  - lefthook

# lefthook's postinstall installs the git hooks, so it has to run on every install:
# with the side-effects cache on, a lefthook already built for another project skips it.
sideEffectsCache: false

# Supply-chain cooldown: malicious releases are usually pulled within 24h; pattern excludes need pnpm >= 10.17.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@variablelab/*"
  - "@rrlab/*"
