packages:
  - shared/*
  - run-run/*
  - vland/cli
onlyBuiltDependencies:
  - "@biomejs/biome"
  - lefthook

# Supply-chain cooldown: malicious releases are usually pulled within 24h; pattern excludes need pnpm >= 10.17.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@variablelab/*"
  - "@rrlab/*"
