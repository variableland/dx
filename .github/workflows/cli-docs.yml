# Regenerates each CLI's CLI.md on a CLI release tag and opens a rolling PR.

name: cli docs

# To add a new CLI:
#   1. Add its tag pattern under `on.push.tags`.
#   2. Add its package dir to the REGISTRY env below.
# The CLI's `build` script must emit `<dir>/dist/cli.usage.kdl`. Output is `<dir>/CLI.md`.
on:
  push:
    tags:
      - "@rrlab/cli@*"
      - "@variablelab/vland@*"
  workflow_dispatch:

# Serialize runs so concurrent CLI tag pushes don't race on the rolling PR branch.
concurrency:
  group: cli-docs
  cancel-in-progress: false

env:
  # One package dir per line. Each must produce `<dir>/dist/cli.usage.kdl` at build time;
  # output is written to `<dir>/CLI.md`.
  REGISTRY: |
    run-run/cli
    vland/cli

# The org default GITHUB_TOKEN is read-only; every job states what it needs.
permissions: {}

jobs:
  regen:
    name: Regenerate CLI docs
    runs-on: ubuntu-latest
    # GITHUB_TOKEN is not used for writes: the vland-bot token pushes the branch
    # and opens the PR (so CI runs on it).
    permissions:
      contents: read
    steps:
      - name: 🔑 Mint vland-bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.VLAND_BOT_CLIENT_ID }}
          private-key: ${{ secrets.VLAND_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: 🧑‍💻 Resolve bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          echo "identity=${APP_SLUG}[bot] <${user_id}+${APP_SLUG}[bot]@users.noreply.github.com>" >> "$GITHUB_OUTPUT"

      - name: ⬇️ Checkout main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          # create-pull-request authenticates its own push with `token` below.
          persist-credentials: false

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          # setup-pnpm caches the pnpm store
          package-manager-cache: false

      - name: ⌛ Setup pnpm
        uses: withvariablelab/gh-actions/actions/setup-pnpm@main

      - name: 🛠️ Setup mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          # Tag-triggered job: don't restore a cache another run could poison.
          cache: false

      - name: 🔨 Build registered CLIs
        run: |
          set -euo pipefail
          filters=()
          while read -r dir; do
            [ -z "$dir" ] && continue
            filters+=("--filter" "./$dir")
          done <<< "$REGISTRY"
          pnpm "${filters[@]}" build

      - name: 📝 Regenerate CLI.md from KDL
        run: |
          set -euo pipefail
          while read -r dir; do
            [ -z "$dir" ] && continue
            kdl="$dir/dist/cli.usage.kdl"
            out="$dir/CLI.md"
            if [ ! -f "$kdl" ]; then
              echo "::warning::missing $kdl, skipping"
              continue
            fi
            echo "→ $out (from $kdl)"
            usage generate markdown \
              --file "$kdl" \
              --out-file "$out" \
              --replace-pre-with-code-fences
          done <<< "$REGISTRY"

      - name: 🚀 Open or update PR
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          committer: ${{ steps.bot.outputs.identity }}
          author: ${{ steps.bot.outputs.identity }}
          branch: automation/cli-docs
          base: main
          commit-message: "chore: regenerate CLI docs"
          title: "chore: regenerate CLI docs"
          body: |
            Auto-generated update of CLI markdown docs from each registered CLI's KDL spec.

            Last trigger: tag [`${{ github.ref_name }}`](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }})

            Safe to merge — content is derived from the published CLI's KDL spec via `usage generate markdown`. The branch is rolling: subsequent CLI release tags force-push updated docs onto this same PR.
          labels: |
            automated
            chore
          add-paths: |
            run-run/*/CLI.md
            vland/cli/CLI.md
