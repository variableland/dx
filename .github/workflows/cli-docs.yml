name: cli docs

on:
  push:
    tags:
      - "@rrlab/cli@*"
      - "@variablelab/vland@*"
  workflow_dispatch:

# Serialize runs so concurrent CLI tag pushes don't race on the rolling PR branch.
concurrency:
  group: cli-docs
  cancel-in-progress: false

env:
  # Each dir's build must emit dist/cli.usage.kdl; also add the CLI's tag under on.push.tags.
  REGISTRY: |
    run-run/cli
    vland/cli

permissions: {}

jobs:
  regen:
    name: Regenerate CLI docs
    runs-on: ubuntu-latest
    # Writes use the vland-bot token, not GITHUB_TOKEN, so CI runs on the PR.
    permissions:
      contents: read
    steps:
      - name: 🔑 Mint vland-bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.VLAND_BOT_CLIENT_ID }}
          private-key: ${{ secrets.VLAND_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: ⬇️ Checkout main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          persist-credentials: false

      - name: 🛠️ Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          # Tag-triggered job: keep mise's cache off (zizmor cache-poisoning).
          cache: false

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔨 Build registered CLIs
        run: |
          set -euo pipefail
          filters=()
          while read -r dir; do
            [ -z "$dir" ] && continue
            filters+=("--filter" "./$dir")
          done <<< "$REGISTRY"
          pnpm "${filters[@]}" build

      - name: 📝 Regenerate CLI.md from KDL
        run: |
          set -euo pipefail
          while read -r dir; do
            [ -z "$dir" ] && continue
            kdl="$dir/dist/cli.usage.kdl"
            out="$dir/CLI.md"
            if [ ! -f "$kdl" ]; then
              echo "::warning::missing $kdl, skipping"
              continue
            fi
            echo "→ $out (from $kdl)"
            usage generate markdown \
              --file "$kdl" \
              --out-file "$out" \
              --replace-pre-with-code-fences
          done <<< "$REGISTRY"

      - name: 🚀 Open or update PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          branch: automation/cli-docs
          base: main
          commit-message: "chore: regenerate CLI docs"
          title: "chore: regenerate CLI docs"
          body: |
            Auto-generated update of CLI markdown docs from each registered CLI's KDL spec.

            Last trigger: tag [`${{ github.ref_name }}`](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }})

            Safe to merge — content is derived from the published CLI's KDL spec via `usage generate markdown`. The branch is rolling: subsequent CLI release tags force-push updated docs onto this same PR.
          labels: |
            automated
            chore
          add-paths: |
            run-run/*/CLI.md
            vland/cli/CLI.md
