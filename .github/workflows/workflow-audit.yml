name: Workflow audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  audit-workflows:
    name: Audit workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # pipx ships with the runner image: no third-party setup action.
      - name: 🔒 Scan workflows
        run: pipx run --spec zizmor==1.30.1 zizmor --format=github .github/
        env:
          # Enables zizmor's online audits (impostor commits, known-vulnerable actions).
          GH_TOKEN: ${{ github.token }}
