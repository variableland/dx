rules:
  unpinned-uses:
    config:
      policies:
        # First-party, tracked at @main on purpose: its main branch is protected by rulesets.
        "withvariablelab/*": ref-pin
        "*": hash-pin
    ignore:
      # Generated by the Pullfrog app, not edited here.
      - pullfrog.yml
  artipacked:
    ignore:
      # Generated by the Pullfrog app, not edited here.
      - pullfrog.yml
  dependabot-cooldown:
    config:
      # Matches pnpm's minimumReleaseAge (1440 minutes) in pnpm-workspace.yaml.
      days: 1
