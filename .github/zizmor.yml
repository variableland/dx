rules:
  unpinned-uses:
    config:
      policies:
        # First-party: dx tracks withvariablelab/gh-actions at @main on purpose.
        # Its main branch is protected by
        # rulesets (PR required, signed commits, no force-push or deletion).
        "withvariablelab/*": ref-pin
        # Everything else must be pinned to a full commit SHA.
        "*": hash-pin
